name: Update deals

on:
  schedule:
    # Friday 18:40 HKT (UTC+8) = Friday 10:40 UTC
    - cron: "40 10 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape WSJ headlines into deals.json
        run: python scrape_wsj_ma.py --output deals.json

      - name: Commit deals.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json
          if git diff --cached --quiet; then
            echo "No deal changes"
          else
            git commit -m "Update deals.json from WSJ RSS"
            git push
          fi
